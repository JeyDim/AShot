[package]
name = "shoter-core"
description = "Platform-independent core of AShot: settings, history, imaging, Box.com client, link rewriting"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
url = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "webp"] }
tokio = { version = "1", features = ["sync", "time", "macros", "rt"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json", "multipart", "form", "query", "http2", "charset", "system-proxy"] }
log = "0.4"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full"] }
wiremock = "0.6"
