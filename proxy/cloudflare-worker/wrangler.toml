name = "advant-one-shots"
main = "worker.js"
compatibility_date = "2026-09-01"

# Attach the worker to the short-link domain. With the main site on the same domain,
# non-matching paths are passed through to the origin by the worker itself.
routes = [
  { pattern = "advant.one/*", zone_name = "advant.one" }
]

[vars]
# S3 storage the screenshots are in (the same as in the AShot build).
# The read-only key — secrets: `wrangler secret put S3_ACCESS_KEY_ID`, `… S3_SECRET_ACCESS_KEY`.
S3_ENDPOINT = "https://storage.yandexcloud.net"
S3_REGION = "ru-central1"
S3_BUCKET = ""
S3_PREFIX = ""
# Links of the Box era: an id not found in the bucket is looked up in Box ("off" — never).
BOX_FALLBACK = "on"
BOX_HOST = "app.box.com"
CACHE_SECONDS = "86400"
