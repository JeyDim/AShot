name: Build

# Every push is built. Builds of the default branch become GitHub releases, which the
# installed apps update to; builds of a branch with an open pull request become «AShot Dev» —
# a separate app (installs next to AShot) published as the prerelease `dev-pr-<N>` and linked
# from the pull request (see README → Установка).
on:
  push:
    branches: ['**']
    paths-ignore: ['**.md', 'docs/**', 'proxy/**', 'deploy/**', 'LICENSE*']
  pull_request:
    # Opened after its last push — the dev build comes right away; closed — it is removed.
    types: [opened, reopened, closed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer build of the same branch (a push or its pull request) cancels the one still running.
  group: build-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: 24
  # Caches are written only by the default branch; other branches reuse them.
  SAVE_CACHE: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
  # Pushes to the default branch and manual runs on it (e.g. after changing secrets).
  IS_RELEASE: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

jobs:
  checks:
    name: Tests (core + UI)
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # Pull requests: the branch itself, not the merge with the base.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: core
          save-if: ${{ env.SAVE_CACHE }}
      - name: Rust core tests
        run: cargo test -p shoter-core
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Typecheck & unit tests
        run: |
          npm run typecheck
          npm test
      - name: UI smoke test (editor & overlay in Chrome, mock backend)
        run: |
          # The runner image ships Google Chrome; download Chromium only if it is missing.
          if command -v google-chrome >/dev/null; then
            export CHROMIUM_PATH="$(command -v google-chrome)"
          else
            npx playwright-core install --with-deps chromium
          fi
          npm run build
          npx vite preview --port 4173 --strictPort &
          for i in $(seq 1 30); do curl -sf http://localhost:4173/ >/dev/null && break; sleep 1; done
          npm run smoke

  windows:
    name: Windows build (${{ matrix.arch }})
    if: github.event.action != 'closed'
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: read # is the branch in an open pull request
    strategy:
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
            machine: '0x8664'
          # Cross-compiled: the image has the MSVC ARM64 tools, and Windows on ARM runners
          # are free only for public repositories.
          - arch: arm64
            target: aarch64-pc-windows-msvc
            machine: '0xAA64'
    # The same in both builds; the publish job takes them from here.
    outputs:
      version: ${{ steps.version.outputs.version }}
      pr: ${{ steps.dev.outputs.pr }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }}
          save-if: ${{ env.SAVE_CACHE }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Dev build of a pull request?
        id: dev
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SAME_REPO: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          pr=""
          if [ "$EVENT" = "pull_request" ]; then
            pr="$PR_NUMBER"
          elif [ "$EVENT" = "push" ] && [ "$IS_RELEASE" != "true" ]; then
            pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq '.[0].number // empty' || true)
          fi
          # Forks and Dependabot get no write token (nor secrets): their pull requests build like a branch.
          if [ "$SAME_REPO" != "true" ] || [ "$GITHUB_ACTOR" = "dependabot[bot]" ]; then pr=""; fi
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          if [ -n "$pr" ]; then echo "AShot Dev for pull request #$pr"; else echo "Regular build"; fi
      - name: Version (major.minor from Cargo.toml, patch = run number)
        id: version
        shell: pwsh
        env:
          PR: ${{ steps.dev.outputs.pr }}
        run: |
          $m = (Select-String -Path Cargo.toml -Pattern '^version = "(\d+)\.(\d+)\.\d+"' | Select-Object -First 1).Matches[0]
          $v = "$($m.Groups[1].Value).$($m.Groups[2].Value).${{ github.run_number }}"
          $config = [ordered]@{ version = $v }
          if ($env:PR) {
            # AShot Dev: installs next to AShot (own settings, history, sign-in, autostart entry),
            # no self-update.
            $config.productName = 'AShot Dev'
            $config.mainBinaryName = 'AShot-Dev'
            $config.identifier = 'one.advant.shoter.dev'
          }
          $config | ConvertTo-Json -Depth 5 | Set-Content -Path "${{ runner.temp }}/version.json" -Encoding utf8NoBOM
          Get-Content "${{ runner.temp }}/version.json"
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Version $v"
      - name: Build installer (NSIS)
        run: npx tauri build --target ${{ matrix.target }} --config "${{ runner.temp }}/version.json"
        env:
          # Built-in Box app: users only press "Sign in with Box" (see README).
          # Empty when the secrets are not set – then the app asks for an own Box app.
          SHOTER_BOX_CLIENT_ID: ${{ secrets.BOX_CLIENT_ID }}
          SHOTER_BOX_CLIENT_SECRET: ${{ secrets.BOX_CLIENT_SECRET }}
          SHOTER_BOX_REDIRECT_URI: ${{ secrets.BOX_REDIRECT_URI }}
          # S3 storage (Yandex Object Storage, see README): with a key built in, uploads go
          # there by default; empty – Box, or the key from the settings.
          SHOTER_S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          SHOTER_S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          SHOTER_S3_BUCKET: ${{ secrets.S3_BUCKET }}
          SHOTER_S3_PREFIX: ${{ secrets.S3_PREFIX }}
          SHOTER_S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          SHOTER_S3_REGION: ${{ secrets.S3_REGION }}
          # Links: https://<PROXY_DOMAIN>/{id}; empty – Box embed links / direct S3 URLs.
          SHOTER_PROXY_DOMAIN: ${{ secrets.PROXY_DOMAIN }}
          # Self-update: latest.json on an own server (e.g. IIS, see README), else the
          # releases of this repository. AShot Dev does not update itself.
          SHOTER_UPDATE_URL: ${{ steps.dev.outputs.pr == '' && secrets.UPDATE_URL || '' }}
          SHOTER_UPDATE_REPO: ${{ steps.dev.outputs.pr == '' && github.repository || '' }}
          # AShot Dev shows which pull request it is.
          # (quoted: an unquoted " #" would start a YAML comment)
          SHOTER_CHANNEL: "${{ steps.dev.outputs.pr != '' && format('PR #{0}', steps.dev.outputs.pr) || '' }}"
      - name: Collect artifacts
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          $pr = "${{ steps.dev.outputs.pr }}"
          $arch = "${{ matrix.arch }}"
          $release = "target/${{ matrix.target }}/release"
          $exe = Get-Item "$release/$(if ($pr) { 'AShot-Dev.exe' } else { 'AShot.exe' })"
          $exeVersion = $exe.VersionInfo.ProductVersion
          if (-not $exeVersion.StartsWith($v)) { throw "$($exe.Name) has version $exeVersion, expected $v" }
          # The PE header names the processor the exe is built for.
          $bytes = [IO.File]::ReadAllBytes($exe.FullName)
          $machine = [BitConverter]::ToUInt16($bytes, [BitConverter]::ToInt32($bytes, 0x3C) + 4)
          if ($machine -ne ${{ matrix.machine }}) { throw ('{0} is built for machine 0x{1:X4}, expected ${{ matrix.machine }}' -f $exe.Name, $machine) }
          New-Item -ItemType Directory -Force out | Out-Null
          if ($pr) {
            # Stable names: the links in the pull request stay the same from build to build.
            $name = if ($arch -eq 'x64') { "AShot-Dev-PR$pr" } else { "AShot-Dev-PR$pr-$arch" }
            Copy-Item (Get-ChildItem "$release/bundle/nsis/*.exe" | Select-Object -First 1).FullName "out/$name-setup.exe"
            Copy-Item $exe.FullName "out/$name-portable.exe"
          } else {
            Copy-Item "$release/bundle/nsis/*.exe" out/
            Copy-Item $exe.FullName "out/AShot_${v}_${arch}-portable.exe"
          }
          Get-ChildItem out | Format-Table Name, Length
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.dev.outputs.pr != '' && 'AShot-Dev' || 'AShot' }}-windows-${{ matrix.arch }}-${{ steps.version.outputs.version }}
          path: out/*
          if-no-files-found: error
          retention-days: 14

  # Both builds together: the update manifest and a draft release, or the dev prerelease.
  publish:
    name: Publish the builds
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # draft release, dev prerelease
      pull-requests: write # the dev build comment in the pull request
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.windows.outputs.version }}
      PR: ${{ needs.windows.outputs.pr }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0 # tags and history for the release notes
      - uses: actions/download-artifact@v8
        with:
          pattern: '*-windows-*'
          path: out
          merge-multiple: true
      - name: Release notes (commits since the previous release)
        if: env.PR == ''
        run: |
          # HEAD — the commit built (a pull request's own head, not the merge commit of github.sha)
          prev=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)
          range=HEAD
          if [ -n "$prev" ] && git rev-parse -q --verify "refs/tags/$prev" >/dev/null; then range="$prev..HEAD"; fi
          git log --no-merges --format='- %s' "$range" | head -n 40 > "${{ runner.temp }}/notes.md"
          [ -s "${{ runner.temp }}/notes.md" ] || git log -1 --format='- %s' HEAD > "${{ runner.temp }}/notes.md"
          cat "${{ runner.temp }}/notes.md"
      - name: Update manifest (latest.json)
        if: env.PR == ''
        shell: pwsh
        run: |
          $v = $env:VERSION
          # latest.json: what the app reads to update (from GitHub or from a mirror such as IIS).
          $base = "${{ github.server_url }}/${{ github.repository }}/releases/download/v$v"
          function Entry($file) {
            $f = Get-Item $file
            [ordered]@{ url = "$base/$($f.Name)"; size = $f.Length; sha256 = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower() }
          }
          function Files($arch) {
            [ordered]@{
              installer = Entry "out/AShot_${v}_${arch}-setup.exe"
              portable = Entry "out/AShot_${v}_${arch}-portable.exe"
            }
          }
          $amd64 = Files x64
          [ordered]@{
            version = $v
            notes = (Get-Content -Raw "${{ runner.temp }}/notes.md").Trim()
            url = "${{ github.server_url }}/${{ github.repository }}/releases/tag/v$v"
            win_amd64 = $amd64
            win_arm64 = Files arm64
            # The old name of win_amd64: versions before the ARM64 builds read only it and reject
            # a manifest without it. To be dropped once they are gone (see README → Обновления).
            files = $amd64
          } | ConvertTo-Json -Depth 5 | Set-Content out/latest.json -Encoding utf8NoBOM
          Get-Content out/latest.json
          Get-ChildItem out | Format-Table Name, Length
      # Default-branch builds: a draft release, published by the next job once the tests pass.
      - name: Draft release
        if: env.IS_RELEASE == 'true'
        shell: pwsh
        run: |
          $v = $env:VERSION
          $files = (Get-ChildItem out).FullName
          gh release view "v$v" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "v$v" $files --clobber
          } else {
            gh release create "v$v" $files --draft --target "${{ github.sha }}" --title "AShot $v" --notes-file "${{ runner.temp }}/notes.md"
          }
          if ($LASTEXITCODE -ne 0) { exit 1 }
      # Pull requests: one prerelease per pull request, replaced by every build. Never
      # "latest" — the apps and the update mirror read only the latest release.
      - name: Dev build → prerelease and a comment in the pull request
        if: env.PR != ''
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -eu
          tag="dev-pr-$PR"
          short="${SHA:0:7}"
          gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$tag" out/* --repo "$GITHUB_REPOSITORY" --prerelease --latest=false --target "$SHA" \
            --title "AShot Dev — PR #$PR" \
            --notes "Dev-сборка $VERSION ($short) для #$PR. Ставится рядом с AShot как «AShot Dev»: свои настройки и история, сама не обновляется. Заменяется при каждом пуше в pull request и удаляется, когда он закрыт."
          base="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$tag"
          marker='<!-- ashot-dev-build -->'
          body=$(cat <<EOF
          $marker
          ### Dev-сборка для проверки
          **AShot Dev $VERSION** · коммит \`$short\` · [сборка]($RUN_URL)

          - [Установщик]($base/AShot-Dev-PR$PR-setup.exe) — ставится рядом с AShot как «AShot Dev»
          - [Portable]($base/AShot-Dev-PR$PR-portable.exe) — без установки
          - Windows на ARM: [установщик]($base/AShot-Dev-PR$PR-arm64-setup.exe) · [portable]($base/AShot-Dev-PR$PR-arm64-portable.exe)

          AShot Dev — отдельная программа: свои настройки, история и вход в Box, метка «DEV» в панели, сама не обновляется. Горячие клавиши те же, что у AShot, — на время проверки выйдите из AShot (трей → «Выход»).
          Ссылки не меняются: сборка заменяется при каждом пуше в этот pull request и удаляется, когда он закрыт.
          EOF
          )
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate --jq ".[] | select(.body | contains(\"$marker\")) | .id" | head -n1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body" > /dev/null
          fi
          echo "### AShot Dev $VERSION — $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$tag" >> "$GITHUB_STEP_SUMMARY"

  dev-cleanup:
    name: Remove the dev build of a closed pull request
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - name: Delete the prerelease, update the comment
        run: |
          if gh release delete "dev-pr-$PR" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes; then echo "removed dev-pr-$PR"; else echo "no dev build"; fi
          marker='<!-- ashot-dev-build -->'
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate --jq ".[] | select(.body | contains(\"$marker\")) | .id" | head -n1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$marker
          Dev-сборка удалена: pull request закрыт." > /dev/null || true
          fi

  release:
    name: Publish release
    needs: [checks, windows, publish]
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v${{ needs.windows.outputs.version }}
      KEEP: 20 # published releases to keep (older ones are deleted with their tags)
    steps:
      - name: Publish (installed apps and update mirrors pick it up)
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
      - name: Clean up drafts of cancelled builds and old releases
        run: |
          export GH_REPO="$GITHUB_REPOSITORY"
          gh release list --limit 200 --json tagName,isDraft --jq '.[] | select(.isDraft) | .tagName' |
            while read -r t; do if [ "$t" != "$TAG" ]; then gh release delete "$t" --yes; fi; done
          # Dev builds of pull requests (prereleases) are left to their pull requests.
          gh release list --exclude-drafts --exclude-pre-releases --limit 200 --json tagName,createdAt \
            --jq "sort_by(.createdAt) | reverse | .[$KEEP:] | .[].tagName" |
            while read -r t; do gh release delete "$t" --yes --cleanup-tag; done
      - name: Summary
        run: echo "### Опубликован $TAG — ${{ github.server_url }}/${{ github.repository }}/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
